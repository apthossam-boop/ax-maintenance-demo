<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>شاشة المعدات — مستخدمو الشركة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="login-view" class="view">
      <div class="panel login-panel">
        <p class="brand">صيانة المعدات</p>
        <h1>مستخدمو الشركة</h1>
        <p class="subtitle">عرض كل المعدات وأوامر الصيانة</p>
        <form id="login-form">
          <label for="username">اسم المستخدم</label>
          <input id="username" type="text" value="staff" required autocomplete="username" />
          <label for="password">كلمة المرور</label>
          <input id="password" type="password" value="staff123" required autocomplete="current-password" />
          <button type="submit">دخول</button>
        </form>
        <p class="hint">للتجربة: <strong>staff</strong> / <strong>staff123</strong></p>
        <p class="hint"><a class="link" href="/">بوابة العملاء</a></p>
      </div>
    </section>

    <section id="main-view" class="view wide hidden">
      <header class="topbar">
        <div>
          <p class="brand">كل المعدات</p>
          <p id="welcome" class="welcome"></p>
        </div>
        <div class="topbar-actions">
          <a class="ghost btn-link" href="/">بوابة العملاء</a>
          <button type="button" id="logout-btn" class="ghost">خروج</button>
        </div>
      </header>

      <div class="panel">
        <div class="stats" id="stats"></div>
        <form id="filter-form" class="search-row">
          <input id="filter-q" type="text" placeholder="بحث: معدة / أمر شغل / تليفون / فني" />
          <select id="filter-status">
            <option value="">كل الحالات</option>
            <option>فحص</option>
            <option>قيد الإصلاح</option>
            <option>اختبار</option>
            <option>تسليم</option>
          </select>
          <button type="submit">تصفية</button>
          <button type="button" id="refresh-btn" class="ghost">تحديث</button>
        </form>
        <p id="filter-error" class="error hidden"></p>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="equip-table" id="equip-table">
            <thead>
              <tr>
                <th>أمر الشغل</th>
                <th>المعدة</th>
                <th>كود المعدة</th>
                <th>الحالة</th>
                <th>الفني</th>
                <th>تليفون العميل</th>
                <th>التكلفة</th>
              </tr>
            </thead>
            <tbody id="equip-body">
              <tr><td colspan="7" class="muted">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="detail-view" class="view hidden">
      <header class="topbar">
        <button type="button" id="back-btn" class="ghost">← رجوع للقائمة</button>
        <button type="button" id="logout-btn-2" class="ghost">خروج</button>
      </header>
      <div class="panel" id="detail-content"></div>
    </section>
  </div>
  <script src="company.js"></script>
</body>
</html>
